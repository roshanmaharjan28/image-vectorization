<!doctype html>
<html>
<head><meta charset="utf-8"><title>palette texture repro</title></head>
<body style="background:#222;color:#eee;font-family:monospace">
<div id="out">running...</div>
<canvas id="c1" width="4" height="4" style="width:100px;height:100px;image-rendering:pixelated;border:1px solid red"></canvas>
<canvas id="c2" width="4" height="4" style="width:100px;height:100px;image-rendering:pixelated;border:1px solid lime"></canvas>
<script>
function makeGl(canvasId) {
  const canvas = document.getElementById(canvasId);
  return canvas.getContext('webgl2');
}

// Vertex shader: draws one fullscreen-ish quad per instance? Simpler: draw layerCount
// quads stacked as thin horizontal strips, each tagged with its layer index, and read back
// the color of the LAST layer's strip (the one most likely to reveal an out-of-range/incomplete
// texture problem).
const VS = `#version 300 es
layout(location=0) in vec2 a_pos;
layout(location=1) in float a_layer;
flat out int v_layer;
void main() {
  gl_Position = vec4(a_pos, 0.0, 1.0);
  v_layer = int(a_layer + 0.5);
}`;

function oldFS() {
  return `#version 300 es
precision highp float;
flat in int v_layer;
uniform sampler2D u_palette;
out vec4 outColor;
void main() {
  vec4 c = texelFetch(u_palette, ivec2(v_layer, 0), 0);
  outColor = vec4(c.rgb, 1.0);
}`;
}

function newFS() {
  return `#version 300 es
precision highp float;
flat in int v_layer;
uniform sampler2D u_palette;
uniform int u_paletteWidth;
out vec4 outColor;
void main() {
  vec4 c = texelFetch(u_palette, ivec2(v_layer % u_paletteWidth, v_layer / u_paletteWidth), 0);
  outColor = vec4(c.rgb, 1.0);
}`;
}

function compile(gl, type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function run(canvasId, fsSrc, useNewLayout, layerCount, maxTextureSize) {
  const gl = makeGl(canvasId);
  const vs = compile(gl, gl.VERTEX_SHADER, VS);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc);
  const prog = link(gl, vs, fs);

  // One thin strip per layer, covering the full viewport height in aggregate, in layer order.
  const positions = [];
  const layerIdx = [];
  const indices = [];
  for (let i = 0; i < layerCount; i++) {
    const y0 = 1 - 2 * (i / layerCount);
    const y1 = 1 - 2 * ((i + 1) / layerCount);
    const base = positions.length / 2;
    positions.push(-1, y0,  1, y0,  1, y1,  -1, y1);
    layerIdx.push(i, i, i, i);
    indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const layerBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, layerBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(layerIdx), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
  const idxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(indices), gl.STATIC_DRAW);

  // Palette: every layer gets a bright, non-black color so any black pixel = broken sampling.
  const paletteFlat = new Uint8Array(layerCount * 4);
  for (let i = 0; i < layerCount; i++) {
    paletteFlat[i * 4 + 0] = 40 + (i * 7) % 200;
    paletteFlat[i * 4 + 1] = 200;
    paletteFlat[i * 4 + 2] = 90;
    paletteFlat[i * 4 + 3] = 255;
  }

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  let paletteWidth;
  if (!useNewLayout) {
    paletteWidth = layerCount; // OLD behavior: one row, layerCount wide
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, layerCount, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, paletteFlat);
  } else {
    const width = Math.min(layerCount, maxTextureSize);
    const height = Math.ceil(layerCount / width);
    paletteWidth = width;
    let data = paletteFlat;
    if (width * height !== layerCount) {
      data = new Uint8Array(width * height * 4);
      data.set(paletteFlat);
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  }
  const glErrAfterUpload = gl.getError();

  gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_palette'), 0);
  const pwLoc = gl.getUniformLocation(prog, 'u_paletteWidth');
  if (pwLoc) gl.uniform1i(pwLoc, paletteWidth);
  gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_INT, 0);

  const px = new Uint8Array(4);
  gl.readPixels(1, 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // near-bottom strip = last layers
  const pxTop = new Uint8Array(4);
  gl.readPixels(1, gl.canvas.height - 2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pxTop); // top strip = first layers

  return { glErrAfterUpload, bottomPixel: [...px], topPixel: [...pxTop], paletteWidth };
}

const probeGl = makeGl('c1');
const maxTextureSize = probeGl.getParameter(probeGl.MAX_TEXTURE_SIZE);
const layerCount = maxTextureSize + 5000; // deliberately exceeds this GPU's row-width limit

const oldResult = run('c1', oldFS(), false, layerCount, maxTextureSize);
const newResult = run('c2', newFS(), true, layerCount, maxTextureSize);

document.getElementById('out').textContent =
  'MAX_TEXTURE_SIZE=' + maxTextureSize + ', layerCount=' + layerCount + '\n\n' +
  'OLD (1-row texture):\n' +
  '  GL error after texImage2D: ' + oldResult.glErrAfterUpload + '\n' +
  '  bottom-strip pixel (last layers): ' + JSON.stringify(oldResult.bottomPixel) + '\n' +
  '  top-strip pixel (first layers): ' + JSON.stringify(oldResult.topPixel) + '\n\n' +
  'NEW (capped 2D grid, width=' + newResult.paletteWidth + '):\n' +
  '  GL error after texImage2D: ' + newResult.glErrAfterUpload + '\n' +
  '  bottom-strip pixel (last layers): ' + JSON.stringify(newResult.bottomPixel) + '\n' +
  '  top-strip pixel (first layers): ' + JSON.stringify(newResult.topPixel);
</script>
</body>
</html>
